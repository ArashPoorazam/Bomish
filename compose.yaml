name: bomish
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bomish
      POSTGRES_USER: bomish
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bomish-local-only}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bomish -d bomish"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./backend
    environment:
      APP_ENV: development
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgres://bomish:${POSTGRES_PASSWORD:-bomish-local-only}@db:5432/bomish?sslmode=disable
      SEED_DEMO: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
  web:
    build: ./frontend
    environment:
      API_URL: http://api:8080
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      SITE_INDEXABLE: "false"
    depends_on:
      api:
        condition: service_healthy
  gateway:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
volumes:
  postgres:
  uploads:
