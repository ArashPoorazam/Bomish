name: Verify Bomish
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bomish
          POSTGRES_USER: bomish
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bomish" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://bomish:test-only@localhost:5432/bomish?sslmode=disable
      TEST_DATABASE_URL: postgres://bomish:test-only@localhost:5432/bomish?sslmode=disable
      APP_ENV: development
      APP_ORIGIN: http://localhost:3000
      SEED_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go test -race ./...
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run api:generate && git diff --exit-code src/lib/api-types.ts
        working-directory: frontend
      - run: npm run typecheck && npm run format:check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          (cd backend && go run ./cmd/server > /tmp/bomish-api.log 2>&1) &
          (cd frontend && npm run start > /tmp/bomish-web.log 2>&1) &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/v1/health; then break; fi
            sleep 1
          done
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
