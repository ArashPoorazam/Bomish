name: Publish verified images
on:
  workflow_run:
    workflows: [Verify Bomish]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.names.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "repository=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        id: api
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ steps.names.outputs.repository }}/api:${{ steps.names.outputs.commit }}
          provenance: true
          sbom: true
      - uses: docker/build-push-action@v7
        id: web
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ steps.names.outputs.repository }}/web:${{ steps.names.outputs.commit }}
          provenance: true
          sbom: true
      - uses: docker/build-push-action@v7
        id: backup
        with:
          context: deploy/backup
          push: true
          tags: ghcr.io/${{ steps.names.outputs.repository }}/backup:${{ steps.names.outputs.commit }}
          provenance: true
          sbom: true
      - name: Scan published api digest
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/${{ steps.names.outputs.repository }}/api@${{ steps.api.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan published web digest
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/${{ steps.names.outputs.repository }}/web@${{ steps.web.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan published backup digest
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/${{ steps.names.outputs.repository }}/backup@${{ steps.backup.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Write immutable release artifact
        env:
          REPOSITORY: ${{ steps.names.outputs.repository }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          BACKUP_DIGEST: ${{ steps.backup.outputs.digest }}
        run: |
          printf 'API_IMAGE=ghcr.io/%s/api@%s\nWEB_IMAGE=ghcr.io/%s/web@%s\nBACKUP_IMAGE=ghcr.io/%s/backup@%s\n' "$REPOSITORY" "$API_DIGEST" "$REPOSITORY" "$WEB_DIGEST" "$REPOSITORY" "$BACKUP_DIGEST" > images.env
      - uses: actions/upload-artifact@v7
        with:
          name: images-${{ steps.names.outputs.commit }}
          path: images.env
          retention-days: 90
          overwrite: true

  deploy:
    needs: publish
    if: vars.DEPLOY_MODE == 'prepare' || vars.DEPLOY_MODE == 'auto'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      actions: read
    concurrency:
      group: bomish-production
      cancel-in-progress: false
    steps:
      - name: Skip releases superseded on main
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.publish.outputs.commit }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" = "$RELEASE_COMMIT" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipped superseded release $RELEASE_COMMIT." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v7
        if: steps.release.outputs.current == 'true'
        with:
          ref: ${{ needs.publish.outputs.commit }}
          persist-credentials: false
      - name: Download this run's verified image manifest
        if: steps.release.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.publish.outputs.commit }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "images-$RELEASE_COMMIT" --dir "$RUNNER_TEMP/bomish-images"
      - name: Deliver release over SSH
        if: steps.release.outputs.current == 'true'
        env:
          RELEASE_COMMIT: ${{ needs.publish.outputs.commit }}
          DEPLOY_MODE: ${{ vars.DEPLOY_MODE }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: bash scripts/deploy-over-ssh.sh "$RELEASE_COMMIT" "$RUNNER_TEMP/bomish-images/images.env"
      - name: Verify public HTTPS
        if: steps.release.outputs.current == 'true' && vars.DEPLOY_MODE == 'auto'
        env:
          SITE_URL: ${{ vars.DEPLOY_SITE_URL || 'https://bomish.ir' }}
        run: |
          python3 scripts/verify-site.py --public-url "$SITE_URL"
