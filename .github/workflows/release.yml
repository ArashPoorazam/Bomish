name: Publish verified images
on:
  workflow_run:
    workflows: [Verify Bomish]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "repository=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: api
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ steps.names.outputs.repository }}/api:${{ steps.names.outputs.commit }}
          provenance: true
          sbom: true
      - uses: docker/build-push-action@v6
        id: web
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ steps.names.outputs.repository }}/web:${{ steps.names.outputs.commit }}
          provenance: true
          sbom: true
      - uses: docker/build-push-action@v6
        id: backup
        with:
          context: deploy/backup
          push: true
          tags: ghcr.io/${{ steps.names.outputs.repository }}/backup:${{ steps.names.outputs.commit }}
          provenance: true
          sbom: true
      - name: Scan published api digest
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/${{ steps.names.outputs.repository }}/api@${{ steps.api.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan published web digest
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/${{ steps.names.outputs.repository }}/web@${{ steps.web.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan published backup digest
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/${{ steps.names.outputs.repository }}/backup@${{ steps.backup.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Write immutable release artifact
        env:
          REPOSITORY: ${{ steps.names.outputs.repository }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          BACKUP_DIGEST: ${{ steps.backup.outputs.digest }}
        run: |
          printf 'API_IMAGE=ghcr.io/%s/api@%s\nWEB_IMAGE=ghcr.io/%s/web@%s\nBACKUP_IMAGE=ghcr.io/%s/backup@%s\n' "$REPOSITORY" "$API_DIGEST" "$REPOSITORY" "$WEB_DIGEST" "$REPOSITORY" "$BACKUP_DIGEST" > images.env
      - uses: actions/upload-artifact@v4
        with:
          name: images-${{ steps.names.outputs.commit }}
          path: images.env
          retention-days: 90
